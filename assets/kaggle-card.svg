<svg xmlns="http://www.w3.org/2000/svg" width="820" height="216" viewBox="0 0 820 216">
  <defs>
    <style>
      .term-title { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #00e5ff; letter-spacing: 1px; }
      .tag-tier { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 600; fill: #38ef7d; letter-spacing: 1px; }
      .comp-title { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .comp-desc { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 12px; fill: #cbd5e1; }
      .comp-sub { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11.5px; fill: #38bdf8; font-weight: 600; }
      .rank-large { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 16px; font-weight: 800; fill: #ffffff; }
      .rank-sub { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #00e5ff; }
      .badge-silver { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 800; fill: #f1f5f9; letter-spacing: 1.5px; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 10px; font-weight: 600; fill: #94a3b8; }
      .medal-tally { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #e2e8f0; }
      .link-prompt { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 700; fill: #00e5ff; letter-spacing: 0.5px; }
      .tier-big { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 20px; font-weight: 900; fill: #38ef7d; letter-spacing: 2px; }
    </style>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d0a8"/>
      <stop offset="35%" stop-color="#cd8a52"/>
      <stop offset="100%" stop-color="#8a5228"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="816" height="212" rx="4" fill="url(#cardBg)" stroke="#00e5ff" stroke-width="1.5"/>
  <rect x="7" y="7" width="806" height="202" rx="2" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Corner Pixel Accents -->
  <rect x="3" y="3" width="5" height="5" fill="#00e5ff"/>
  <rect x="812" y="3" width="5" height="5" fill="#00e5ff"/>
  <rect x="3" y="208" width="5" height="5" fill="#00e5ff"/>
  <rect x="812" y="208" width="5" height="5" fill="#00e5ff"/>

  <!-- Top Header Bar -->
  <path d="M8 8 H812 V34 H8 Z" fill="#0f172a" opacity="0.85"/>
  <line x1="8" y1="34" x2="812" y2="34" stroke="#1e293b" stroke-width="1"/>

  <rect x="18" y="15" width="7" height="11" fill="#00e5ff"/>
  <text class="term-title" x="32" y="23">KAGGLE AWARDS // DEMACIA1314</text>
  <text class="tag-tier" x="792" y="23" text-anchor="end">● VERIFIED VIA KAGGLE API</text>

  <!-- Left: Tier Panel -->
  <g transform="translate(22, 44)">
    <rect x="0" y="0" width="176" height="156" rx="3" fill="#0a101d" stroke="#1e293b" stroke-width="1"/>

    <!-- Pixel Medal Stack: Silver + Bronze -->
    <g transform="translate(30, 12)">
      <!-- Silver medal -->
      <polygon points="20,0 36,0 44,9 44,22 36,31 20,31 12,22 12,9" fill="url(#silverGrad)" stroke="#f8fafc" stroke-width="1.5"/>
      <circle cx="28" cy="15.5" r="7" fill="#0b1220" stroke="#94a3b8" stroke-width="1"/>
      <text x="28" y="19.5" font-family="monospace" font-size="9" font-weight="900" fill="#e2e8f0" text-anchor="middle">Ag</text>
      <!-- Bronze medal -->
      <polygon points="70,4 84,4 91,12 91,24 84,32 70,32 63,24 63,12" fill="url(#bronzeGrad)" stroke="#f3d0a8" stroke-width="1.3"/>
      <circle cx="77" cy="18" r="6" fill="#1a0f06" stroke="#cd8a52" stroke-width="1"/>
      <text x="77" y="21.5" font-family="monospace" font-size="8" font-weight="900" fill="#f3d0a8" text-anchor="middle">Bz</text>
    </g>

    <text class="badge-silver" x="88" y="92" text-anchor="middle">COMPETITIONS TIER</text>
    <line x1="20" y1="99" x2="156" y2="99" stroke="#1e293b" stroke-width="1"/>

    <text class="tier-big" x="88" y="122" text-anchor="middle">EXPERT</text>
    <text class="label-dim" x="88" y="139" text-anchor="middle">TOP 0.74% GLOBALLY</text>
  </g>

  <!-- Right: Medal Details -->
  <g transform="translate(212, 44)">
    <!-- Silver row -->
    <rect x="0" y="0" width="586" height="64" rx="3" fill="#0c192c" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="14" y="13" width="34" height="34" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
    <text x="31" y="37" font-size="17" text-anchor="middle">🥈</text>
    <text class="comp-title" x="58" y="28">AI Agent Security - Multi-Step Tool Attacks</text>
    <text class="comp-desc" x="58" y="45">Featured · Code Competition · 4,186 Teams Worldwide</text>
    <text class="comp-sub" x="58" y="59">OFFICIAL AWARD: SILVER MEDAL (TOP 1.07%)</text>

    <rect x="452" y="13" width="120" height="38" rx="2" fill="#0a1120" stroke="#1e293b" stroke-width="1"/>
    <text class="rank-large" x="512" y="30" text-anchor="middle" fill="#ffffff">RANK #45</text>
    <text class="rank-sub" x="512" y="44" text-anchor="middle">LEADERBOARD</text>

    <!-- Bronze row -->
    <rect x="0" y="72" width="586" height="40" rx="3" fill="#1a1008" stroke="#cd8a52" stroke-width="1"/>
    <rect x="14" y="79" width="26" height="26" rx="3" fill="#241407" stroke="#cd8a52" stroke-width="1"/>
    <text x="27" y="98" font-size="14" text-anchor="middle">🥉</text>
    <text class="comp-desc" x="50" y="96" fill="#f3d0a8">BRONZE MEDAL · Competition details available on Kaggle profile</text>
    <text class="link-prompt" x="570" y="96" text-anchor="end">VIEW &#x2192;</text>

    <!-- Bottom Bar: Medal Tally & Profile Link -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="586" height="38" rx="2" fill="#080f1a" stroke="#1e293b" stroke-dasharray="3,3"/>
      <text class="medal-tally" x="16" y="24">🏆 MEDALS:  [GOLD: 0]  <tspan fill="#e2e8f0">[SILVER: 1]</tspan>  <tspan fill="#f3d0a8">[BRONZE: 1]</tspan></text>
      <text class="link-prompt" x="570" y="24" text-anchor="end">VIEW KAGGLE PROFILE &#x2192;</text>
    </g>
  </g>
</svg>
