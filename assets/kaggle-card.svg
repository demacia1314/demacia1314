<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200">
  <defs>
    <style>
      .term-title { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #00e5ff; letter-spacing: 1px; }
      .tag-tier { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 600; fill: #38ef7d; letter-spacing: 1px; }
      .comp-title { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .comp-desc { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 12px; fill: #cbd5e1; }
      .comp-sub { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11.5px; fill: #38bdf8; font-weight: 600; }
      .rank-large { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 16px; font-weight: 800; fill: #ffffff; }
      .rank-sub { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #00e5ff; }
      .badge-silver { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 800; fill: #f1f5f9; letter-spacing: 1.5px; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 10px; font-weight: 600; fill: #94a3b8; }
      .medal-tally { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #e2e8f0; }
      .link-prompt { font-family: ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 700; fill: #00e5ff; letter-spacing: 0.5px; }
    </style>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="816" height="196" rx="4" fill="url(#cardBg)" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- Inner Pixel Border Lines -->
  <rect x="7" y="7" width="806" height="186" rx="2" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Corner Pixel Accents -->
  <rect x="3" y="3" width="5" height="5" fill="#00e5ff"/>
  <rect x="812" y="3" width="5" height="5" fill="#00e5ff"/>
  <rect x="3" y="192" width="5" height="5" fill="#00e5ff"/>
  <rect x="812" y="192" width="5" height="5" fill="#00e5ff"/>

  <!-- Top Header Bar -->
  <path d="M8 8 H812 V34 H8 Z" fill="#0f172a" opacity="0.85"/>
  <line x1="8" y1="34" x2="812" y2="34" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Terminal Prompt Dot -->
  <rect x="18" y="15" width="7" height="11" fill="#00e5ff"/>
  <text class="term-title" x="32" y="23">KAGGLE AWARDS // DEMACIA1314</text>
  <text class="tag-tier" x="792" y="23" text-anchor="end">● VERIFIED SILVER MEDALIST</text>

  <!-- Left: Pixel Trophy & Silver Badge -->
  <g transform="translate(22, 44)">
    <rect x="0" y="0" width="176" height="140" rx="3" fill="#0a101d" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Pixel Trophy / Medal Art -->
    <g transform="translate(44, 10)">
      <!-- Ribbon -->
      <path d="M14,0 H26 L22,20 L10,20 Z" fill="#3b82f6"/>
      <path d="M34,0 H46 L50,20 L38,20 Z" fill="#00e5ff"/>
      <rect x="26" y="0" width="8" height="20" fill="#1d4ed8"/>
      <polygon points="10,20 18,27 26,20" fill="#2563eb"/>
      <polygon points="34,20 42,27 50,20" fill="#0891b2"/>
      
      <!-- Medal Body -->
      <polygon points="20,26 36,26 46,36 46,50 36,60 20,60 10,50 10,36" fill="url(#silverGrad)" stroke="#f8fafc" stroke-width="1.5"/>
      <polygon points="22,30 34,30 42,38 42,48 34,56 22,56 14,48 14,38" fill="#0b1220" stroke="#94a3b8" stroke-width="1"/>
      <text x="28" y="47" font-family="monospace" font-size="14" font-weight="900" fill="#e2e8f0" text-anchor="middle">2</text>
    </g>

    <text class="badge-silver" x="88" y="86" text-anchor="middle">SILVER MEDAL</text>
    <line x1="20" y1="93" x2="156" y2="93" stroke="#1e293b" stroke-width="1"/>
    
    <text class="rank-large" x="88" y="112" text-anchor="middle">TOP 1.07%</text>
    <text class="label-dim" x="88" y="128" text-anchor="middle">RANK 45 / 4,186</text>
  </g>

  <!-- Right: Medal Details -->
  <g transform="translate(212, 44)">
    <rect x="0" y="0" width="586" height="88" rx="3" fill="#0c192c" stroke="#38bdf8" stroke-width="1.2"/>
    
    <rect x="14" y="14" width="34" height="34" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
    <text x="31" y="38" font-size="18" text-anchor="middle">🥈</text>
    
    <text class="comp-title" x="58" y="30">AI Agent Security - Multi-Step Tool Attacks</text>
    <text class="comp-desc" x="58" y="48">Featured · Code Competition · 4,186 Teams Worldwide</text>
    <text class="comp-sub" x="58" y="66">OFFICIAL AWARD: SILVER MEDAL (TOP 1.07%)</text>

    <!-- Leaderboard Rank Pill -->
    <rect x="446" y="14" width="126" height="60" rx="2" fill="#0a1120" stroke="#1e293b" stroke-width="1"/>
    <text class="rank-large" x="509" y="38" text-anchor="middle" fill="#ffffff">RANK #45</text>
    <line x1="456" y1="46" x2="562" y2="46" stroke="#1e293b" stroke-width="1"/>
    <text class="rank-sub" x="509" y="60" text-anchor="middle">LEADERBOARD</text>

    <!-- Bottom Bar: Medal Tally & Profile Link -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="586" height="40" rx="2" fill="#080f1a" stroke="#1e293b" stroke-dasharray="3,3"/>
      <text class="medal-tally" x="16" y="25">🏆 MEDALS:  [GOLD: 0]  <tspan fill="#00e5ff">[SILVER: 1]</tspan>  [BRONZE: 0]</text>
      <text class="link-prompt" x="570" y="25" text-anchor="end">VIEW KAGGLE PROFILE &#x2192;</text>
    </g>
  </g>
</svg>