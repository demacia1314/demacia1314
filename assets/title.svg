<svg xmlns="http://www.w3.org/2000/svg" width="640" height="130" viewBox="0 0 640 130">
  <defs>
    <style>
      text{font-family:Consolas,"Courier New",monospace;font-weight:900;font-size:60px;letter-spacing:6px;text-anchor:middle}
      .g{fill:#36ff4d;animation:g1 2.7s steps(1) infinite}
      .r{fill:#ff2975;animation:g2 3.1s steps(1) infinite}
      .b{fill:#00e5ff;animation:fl 2.4s steps(1) infinite}
      .bar{fill:#00e5ff;opacity:.22;animation:sweep 3.6s linear infinite}
      @keyframes g1{0%,100%{transform:translate(0,0)}18%{transform:translate(-4px,2px)}36%{transform:translate(3px,-2px)}54%{transform:translate(-2px,1px)}72%{transform:translate(4px,0)}}
      @keyframes g2{0%,100%{transform:translate(0,0)}22%{transform:translate(5px,-2px)}44%{transform:translate(-4px,1px)}66%{transform:translate(2px,2px)}}
      @keyframes fl{0%,90%,100%{opacity:1}92%{opacity:.2}95%{opacity:.9}97%{opacity:.1}}
      @keyframes sweep{0%{transform:translateY(-10px)}100%{transform:translateY(140px)}}
    </style>
  </defs>
  <rect class="bar" x="0" y="0" width="640" height="6"/>
  <text class="g" x="322" y="84">DEMACIA1314</text>
  <text class="r" x="318" y="82">DEMACIA1314</text>
  <text class="b" x="320" y="84">DEMACIA1314</text>
</svg>